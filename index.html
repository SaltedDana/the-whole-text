<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Whole Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--ink:#1d2330;--muted:#586072;--card:#fff;--line:#d9d8d2;--tl:94%;--al:36%;--bl:80%;--sat:62%;
  --font-body:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--font-head:'Rubik','Heebo',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#14171e;--ink:#e8eaf0;--muted:#a2a9b8;--card:#1b1f29;--line:#323847;--tl:19%;--al:72%;--bl:36%;--sat:42%}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.7}
main{max-width:920px;margin:0 auto;padding:32px 16px 80px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--font-head);margin:0}
h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.15}
.lead{color:var(--muted);margin:8px 0 0;max-width:62ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
textarea{width:100%;min-height:190px;border:1px solid var(--line);border-radius:10px;padding:14px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus-visible,button:focus-visible{outline:3px solid hsl(212 60% var(--al));outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;font-weight:700;border-radius:999px;padding:10px 22px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.5;cursor:wait}
#status{color:var(--muted);font-size:.95rem}
.map h2{font-size:1.15rem;margin-bottom:10px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:1rem}
.stats b{font-family:var(--font-head);font-size:1.35rem;margin-inline-end:6px}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:14px 0 6px;border:1px solid var(--line)}
.bar span{display:grid;place-items:center;font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;padding:0 6px;
  background:hsl(var(--h) var(--sat) var(--tl));border-inline-end:1px solid var(--line);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:3px 12px;border-radius:999px;font-size:.9rem;background:hsl(var(--h) var(--sat) var(--tl));border:1px solid hsl(var(--h) var(--sat) var(--bl))}
.main-point{margin:14px 0 0;padding:12px 14px;border-inline-start:5px solid var(--ink);background:var(--bg);border-radius:6px}
.main-point small,.tag{display:block;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:hsl(var(--h,220) 60% var(--al));font-weight:700;margin-bottom:4px}
.main-point small{color:var(--muted)}
.proof{font-size:.9rem;color:var(--muted);margin:12px 0 0}
#out{display:flex;flex-direction:column;gap:16px}
#out p{margin:0;max-width:68ch}
.blk{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid hsl(var(--h) 60% var(--al));border-radius:12px;padding:14px 18px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch}
.duel.n3{grid-template-columns:1fr auto 1fr auto 1fr}
.box{background:hsl(var(--h) var(--sat) var(--tl));border:2px solid hsl(var(--h) 60% var(--al));border-radius:12px;padding:14px 16px}
.link{display:grid;place-items:center;padding:0 10px;font-weight:700;font-size:.95rem;color:hsl(var(--h) 60% var(--al));text-align:center;max-width:130px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
ol.steps li::before{content:counter(s);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;
  background:hsl(var(--h) 60% var(--al));color:var(--card)}
.big{font-family:var(--font-head);font-size:1.4rem;line-height:1.45;font-weight:700;background:hsl(var(--h) var(--sat) var(--tl));border:2px solid hsl(var(--h) 60% var(--al));border-radius:14px;padding:20px 22px}
.big.em{font-size:1.2rem}
details.ex{margin-inline-start:28px;border:1px dashed hsl(var(--h) 60% var(--al));border-radius:10px;padding:10px 16px;background:var(--card)}
details.ex summary{cursor:pointer;font-weight:700;color:hsl(var(--h) 60% var(--al));font-size:.9rem}
mark{background:hsl(var(--h) 60% var(--al));color:var(--card);padding:1px 6px;border-radius:5px;font-weight:700}
@media (max-width:640px){.duel,.duel.n3{grid-template-columns:1fr}.link{max-width:none;padding:6px 0}details.ex{margin-inline-start:10px}}
</style>
</head>
<body>
<main>
<header>
  <h1>The Whole Text</h1>
  <p class="lead">Access to long texts you have to read in full. Nothing is summarized and nothing is changed. You get every original word, in a shape you can stay with.</p>
</header>

<section class="panel">
  <label for="src"><b>Paste the full text</b></label>
  <textarea id="src" placeholder="Paste an article, a contract section, a report..."></textarea>
  <div class="row">
    <button id="go">Read it with me</button>
    <button id="sample" class="ghost" type="button">Use a sample text</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</section>

<section class="panel map" id="map" hidden></section>
<section id="out" aria-label="The text, structured"></section>
</main>

<script>
const HUE={addition:212,contrast:2,concession:28,cause:52,result:112,option:172,condition:140,sequence:196,example:82,emphasis:48,similarity:252,summary:270,plain:220};
const NAME={contrast:'Contrast',concession:'Concession',cause:'Cause',result:'Result',option:'Option versus option',condition:'Condition',sequence:'Steps',example:'Example',emphasis:'Emphasis',similarity:'Similarity',summary:'Summary'};
const SIDE=['contrast','concession','cause','result','option','condition','similarity'];
const SAMPLE=`Remote work changed how teams plan their week. Before 2020, most companies assumed that people do their best work in one shared office. Managers measured presence, and meetings filled the calendar.

Many leaders now believe that remote work lowers productivity. However, several large studies found that output stayed the same or went up when people worked from home two days a week. Although collaboration on new ideas became harder, focused individual work improved.

A company that wants to change its policy has two paths. It can bring everyone back to the office five days a week, or it can design a hybrid week on purpose.

A hybrid week needs a clear order. First, the team picks two shared office days. Second, it moves every recurring meeting to those days. Finally, it protects the home days for deep work.

For example, one software team moved all its planning sessions to Tuesday and Wednesday. As a result, the number of meetings on the other days dropped by half.

In conclusion, the question is how to divide the week so that each kind of work gets the place where it works best.`;

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function split(text){
  const out=[];
  text.split(/\n+/).forEach(p=>{
    p=p.trim(); if(!p) return;
    p.split(/(?<=[.!?]["”)]?)\s+(?=[A-Z"“(\[])/).forEach(s=>{s=s.trim(); if(s) out.push(s);});
  });
  return out;
}

// Local rules: used only when the model is not reachable.
const RULES=[
  ['summary',/^(in conclusion|to conclude|in summary|to sum up|overall|in short|ultimately|all in all)\b/i],
  ['example',/^(for example|for instance|to illustrate)\b/i],
  ['contrast',/^(however|but|yet|in contrast|by contrast|on the other hand|conversely)\b/i],
  ['concession',/^(nevertheless|nonetheless|even so|that said)\b/i],
  ['result',/^(therefore|thus|hence|consequently|as a result)\b/i],
  ['sequence',/^(first|firstly|second|secondly|third|thirdly|next|then|finally|lastly)\b/i]];
function localRules(sents){
  const typed=sents.map(s=>{for(const [t,re] of RULES){const m=s.match(re); if(m) return {t,c:m[0]};} return null;});
  const blocks=[]; let i=0;
  while(i<sents.length){
    const k=typed[i], id=i+1;
    if(!k){blocks.push({type:'plain',parts:[[id]]}); i++; continue;}
    if(k.t==='sequence'){
      const parts=[]; let last=false;
      while(i<sents.length && typed[i] && typed[i].t==='sequence' && !last){
        last=/^(finally|lastly)/i.test(typed[i].c);
        const step=[i+1]; i++;
        while(!last && i<sents.length && !typed[i] && typed.slice(i,i+4).some(x=>x&&x.t==='sequence')){step.push(i+1); i++;}
        parts.push(step);
      }
      blocks.push({type:'sequence',connector:k.c,parts}); continue;
    }
    if(['contrast','concession','result'].includes(k.t)){
      const prev=blocks[blocks.length-1];
      if(prev && prev.type==='plain'){blocks.pop(); blocks.push({type:k.t,connector:k.c,parts:[prev.parts[0],[id]]});}
      else blocks.push({type:k.t,connector:k.c,parts:[[id]]});
      i++; continue;
    }
    if(k.t==='summary'){
      const ids=[id]; i++;
      while(i<sents.length && !typed[i]){ids.push(i+1); i++;}
      blocks.push({type:'summary',connector:k.c,parts:[ids]}); continue;
    }
    blocks.push({type:k.t,connector:k.c,parts:[[id]]}); i++;
  }
  return {blocks};
}

// Guarantee: every sentence id appears exactly once, in order.
function normalize(blocks,n){
  const used=new Set();
  const clean=(blocks||[]).map(b=>({type:HUE[b.type]!==undefined?b.type:'plain',connector:b.connector||'',
    parts:(b.parts||[]).map(p=>(Array.isArray(p)?p:[p]).filter(i=>Number.isInteger(i)&&i>=1&&i<=n&&!used.has(i)&&used.add(i))).filter(p=>p.length)}))
    .filter(b=>b.parts.length).sort((a,b)=>a.parts[0][0]-b.parts[0][0]);
  const out=[]; let cur=1;
  const fill=to=>{for(;cur<to;cur++) if(!used.has(cur)) out.push({type:'plain',connector:'',parts:[[cur]]});};
  clean.forEach(b=>{fill(b.parts[0][0]); out.push(b);});
  fill(n+1);
  return out;
}

function render(struct,sents,source){
  const n=sents.length, blocks=normalize(struct.blocks,n);
  let shown=0;
  const html=blocks.map(b=>{
    let marked=false;
    const sent=id=>{
      shown++;
      const s=sents[id-1], c=b.connector;
      if(c && !marked){
        const at=s.toLowerCase().indexOf(c.toLowerCase());
        if(at>=0){marked=true; return esc(s.slice(0,at))+'<mark>'+esc(s.slice(at,at+c.length))+'</mark>'+esc(s.slice(at+c.length));}
      }
      return esc(s);
    };
    const part=p=>p.map(sent).join(' ');
    const h=`style="--h:${HUE[b.type]}"`, tag=`<span class="tag">${NAME[b.type]||''}</span>`;
    if(b.type==='plain') return `<p>${part(b.parts[0])}</p>`;
    if(b.type==='sequence') return `<div class="blk" ${h}>${tag}<ol class="steps">${b.parts.map(p=>`<li><div>${part(p)}</div></li>`).join('')}</ol></div>`;
    if(b.type==='summary'||b.type==='emphasis') return `<div class="big ${b.type==='emphasis'?'em':''}" ${h}>${tag}${b.parts.map(part).join(' ')}</div>`;
    if(b.type==='example') return `<details class="ex" open ${h}><summary>Example (you can fold it)</summary><p>${b.parts.map(part).join(' ')}</p></details>`;
    if(SIDE.includes(b.type) && b.parts.length>=2){
      const cells=b.parts.map(p=>`<div class="box">${part(p)}</div>`).join(`<div class="link">${esc(b.connector||NAME[b.type])}</div>`);
      return `<div class="blk" ${h}>${tag}<div class="duel ${b.parts.length>2?'n3':''}">${cells}</div></div>`;
    }
    return `<div class="blk" ${h}>${tag}<div class="box">${b.parts.map(part).join(' ')}</div></div>`;
  }).join('');
  $('out').innerHTML=html;

  const words=sents.join(' ').split(/\s+/).length, mins=Math.max(1,Math.round(words/220));
  const count={}; blocks.forEach(b=>{if(b.type!=='plain') count[b.type]=(count[b.type]||0)+1;});
  const secs=(struct.sections||[]).filter(s=>s&&s.from>=1&&s.to>=s.from);
  const secHue={Background:212,Story:28,Example:82,Argument:2,'Main point':48,Summary:270};
  const bar=secs.length?`<div class="bar" aria-label="What is inside the text">${secs.map(s=>`<span style="flex:${s.to-s.from+1};--h:${secHue[s.label]??220}" title="${esc(String(s.label))}">${esc(String(s.label))}</span>`).join('')}</div>`:'';
  const mp=Number.isInteger(struct.main_point)&&sents[struct.main_point-1]?`<p class="main-point"><small>Main point, in the writer's words</small>${esc(sents[struct.main_point-1])}</p>`:'';
  $('map').hidden=false;
  $('map').innerHTML=`<h2>Before you start</h2>
    <div class="stats"><span><b>${words}</b>words</span><span><b>${mins}</b>min to read</span><span><b>${n}</b>sentences</span></div>
    ${bar}
    <div class="chips">${Object.entries(count).map(([t,c])=>`<span class="chip" style="--h:${HUE[t]}">${c} × ${NAME[t]}</span>`).join('')||'<span class="chip" style="--h:220">No strong connectors found</span>'}</div>
    ${mp}
    <p class="proof">${shown} of ${n} original sentences shown, word for word. Structure by ${esc(source)}.</p>`;
  $('map').scrollIntoView({behavior:'smooth',block:'start'});
}

async function run(){
  const sents=split($('src').value);
  if(!sents.length){$('status').textContent='Paste a text first.'; return;}
  $('go').disabled=true; $('status').textContent='Fable 5.2 reads the whole text and finds its structure...';
  try{
    const r=await fetch('/api/structure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sentences:sents})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||r.status);
    render(d.structure,sents,'Fable 5.2');
    $('status').textContent='Done.';
  }catch(e){
    render(localRules(sents),sents,'local rules (model not reachable)');
    $('status').textContent='Model not reachable: '+e.message+'. Showing local rules.';
  }
  $('go').disabled=false;
}
$('go').onclick=run;
$('sample').onclick=()=>{$('src').value=SAMPLE; $('src').focus();};
</script>
</body>
</html>
